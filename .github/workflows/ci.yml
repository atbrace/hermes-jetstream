name: CI
# Community-repo gate. Forgejo Actions: runs-on targets the estate CI lane (`pool-runner`).
# This instance registers no ubuntu-latest runner — jobs asking for it queue forever —
# so a fork moving to GitHub-hosted flips every runs-on back to ubuntu-latest, one line each.
# The live job boots its own nats-server binary (no docker service container), then runs
# smoke + auth matrix + cluster drill as one sequence on it.
# Forgejo instances without runners: run scripts/ci.sh locally — it's the same hermetic gate.
on:
  push: { branches: [main] }
  pull_request:

jobs:
  core:
    # One lane on purpose: the runner container is Debian bookworm with a single
    # system python3 (3.11), and setup-python can't fetch its versions manifest from
    # inside the lane. A GitHub-hosted fork restores the matrix + setup-python here.
    runs-on: pool-runner
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap pip and deps (lane container python3 ships without pip)
        run: |
          set -euo pipefail
          python3 -m ensurepip --upgrade 2>/dev/null || { apt-get update -qq && apt-get install -y -qq python3-pip; }
          python3 -m pip install --user --break-system-packages --quiet 'nats-py>=2.7,<3' nkeys
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/ci.sh

  live:
    runs-on: pool-runner
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap pip and deps
        run: |
          set -euo pipefail
          python3 -m ensurepip --upgrade 2>/dev/null || { apt-get update -qq && apt-get install -y -qq python3-pip; }
          python3 -m pip install --user --break-system-packages --quiet 'nats-py>=2.7,<3' nkeys
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install nats-server
        run: |
          v=2.11.8
          curl -sL "https://github.com/nats-io/nats-server/releases/download/v$v/nats-server-v$v-linux-amd64.tar.gz" | tar xz
          echo "NATS_BIN=$(pwd)/nats-server-v$v-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: nats-server present
        run: test -x "$NATS_BIN" && "$NATS_BIN" --version
      - name: boot scratch nats-server (JetStream)
        run: |
          "$NATS_BIN" -js -p 4222 &
          echo $! > nats.pid
          sleep 2
      - name: live smoke drill (wake/dedupe/self-origin)
        run: HJS_SMOKE_SERVERS=localhost:4222 python3 tests/smoke_live.py
      - name: auth matrix (7 modes + negative refusals)
        run: python3 tests/auth_matrix.py
      - name: cluster drill (R=3, node kill, durable rebind)
        run: python3 tests/cluster_drill.py
      - name: stop scratch nats-server
        if: always()
        run: kill "$(cat nats.pid)" 2>/dev/null || true
